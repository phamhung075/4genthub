# Database-Only Docker Compose Configuration
# For running PostgreSQL and pgAdmin separately
# No build required - uses official PostgreSQL image

services:
  # PostgreSQL Database (no build - uses official image)
  postgres:
    image: postgres:15-alpine
    container_name: agenthub-postgres
    env_file:
      - ../../.env.dev
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      # Mount init scripts for automatic database and user creation on first startup
    networks:
      - agenthub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  pgadmin-data:
    driver: local

networks:
  agenthub-network:
    external: true
    name: agenthub-network