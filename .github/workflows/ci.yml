name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenthub_go
    steps:
      # FULL HISTORY, not the depth-1 default: the repoguards witness asks `git log --all` which commits
      # deleted each pruned path, so a shallow checkout reported nine live entries as typos (CI run
      # 39156598706 on 536df7d6). The test names a shallow clone too, so a future run says why.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: agenthub_go/go.mod
          cache-dependency-path: agenthub_go/go.sum
      # gofmt over every tracked .go file, from the repository root: the script resolves the toplevel
      # itself and learns its two non-Go .go paths from .gofmt-excludes. It exits 2 when it cannot
      # measure (stale exclusion, zero coverage, a parse error) so a broken instrument is not green.
      - run: ../scripts/gofmt-check.sh
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenthub-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agenthub-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
