# Pre-commit hooks configuration for CI/CD and local development
# Install: pre-commit install -c scripts/git-hooks/pre-commit-config.yaml --hook-type pre-commit --hook-type prepare-commit-msg --hook-type commit-msg --hook-type post-commit --hook-type pre-push
#
# NOTE: Hooks run on STAGED files only and automatically re-stage formatted files

repos:
  # Additional checks - run on staged files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^agenthub_go/
      - id: end-of-file-fixer
        exclude: ^agenthub_go/
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict

  # Seat attribution. Decision: ai_docs/core-architecture/agenthub-system-architecture.md (D6; it
  # absorbed ai_docs/architecture-design/decision-seat-attribution.md, deleted in b98a483b).
  # The trailer names the seat that RAN `git commit` - not the author of every line - so it is one
  # half of the fix; the pre-commit ladder checks the lines before the commit takes them.
  # For this stage pre-commit replaces the file list with the commit MESSAGE FILE, which is the
  # hook's argument, so do not add `pass_filenames: false`: it would pass no message file at all.
  - repo: local
    hooks:
      - id: seat-trailer
        name: "seat trailer (Seat: <send address>)"
        entry: scripts/git-hooks/prepare-commit-msg
        language: script
        stages: [prepare-commit-msg]

  # NOTE: the docs-only rule is NOT a hook here. It is checked by the commit wrapper
  # (`scripts/git-hooks/git_commit_capture.py`), which is the only place that sees the PATH SET a seat's
  # pathspec commit carries; a pre-commit hook reads the index, and rule 4's commit form never uses it.

  # A seat's commit message must carry `Task: <hub task uuid>` so the task can be closed. Seats only, merges exempt.
  - repo: local
    hooks:
      - id: task-trailer-guard
        name: "seat commit names its hub task"
        entry: scripts/git-hooks/task-trailer-guard
        language: script
        stages: [commit-msg]

  # After a commit, every running seat is told which commit landed and which files it touched, so a seat
  # that is about to edit one of them reads it again. The script never fails a commit.
  - repo: local
    hooks:
      - id: notify-seats
        name: "tell the running seats about this commit"
        entry: scripts/git-hooks/notify-seats
        language: script
        stages: [post-commit]
        always_run: true
        pass_filenames: false
        verbose: false

  # The remote carries main and frontend only; seats keep their branches and worktrees local.
  - repo: local
    hooks:
      - id: remote-branches
        name: "push only main or frontend"
        entry: scripts/git-hooks/pre-push-branches
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

  # Every `file:line` and backticked `Test` name in ai_docs resolves (scripts/DOC-CITATIONS.py). CI runs it
  # too; here a drifted citation is refused before the push. Exit 2 is a refusal (an unpopulated
  # agenthub_client/), not a violation, and it refuses the push all the same.
  - repo: local
    hooks:
      - id: doc-citations
        name: "every ai_docs citation resolves"
        entry: python3 scripts/DOC-CITATIONS.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
