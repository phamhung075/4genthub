# The script tests' runner config. They live beside the scripts they test, so the repository root
# is two levels up and the canonical command is run from there:
#
#   python3 -m pytest --noconftest -p no:cacheprovider scripts/tests -q
#
# `--noconftest` IS LOAD-BEARING, NOT DECORATION, and it sits in addopts so that a conftest added
# later cannot bring the hang back. The repository conftest reaches for PostgreSQL before every
# test, so without the flag a run of these tests HANGS rather than fails - which is worse, because
# a hang looks like work in progress. Today nothing above this directory carries a conftest,
# pytest.ini, pyproject.toml or setup.cfg, so this is a guard and not a present need: the flag was
# load-bearing at the old home, inside the Python backend tree, where that conftest was in the path.
#
# Both flags appear here AND in the canonical command on purpose. The command is what a seat reads
# in its guide and copies; this file is what protects the run when a seat types it from memory.
#
# The two files that reach the client submodule's modules (`agenthub_client.seat_sync`, `.team_setup`)
# load them at import time, so an absent path used to be a COLLECTION error - no verdict at all,
# which is worse than a red test, because a collection error is silent about which of the two things
# is wrong. They now read the PINNED revision out of the gitlink themselves, through
# `scripts/tests/_client_tree.py`, and that still cannot come from a conftest here, since
# `--noconftest` above is load-bearing. The `pythonpath` setting that used to sit below carried
# `../../agenthub_client/src`, a tree this superproject no longer has - the gitlink tracks it and the
# working tree does not - so it named a deleted directory, and a checkout that happened to exist
# would have SHADOWED the pin, which is the class of bug the pin read exists to close.
[pytest]
addopts = --noconftest -p no:cacheprovider
