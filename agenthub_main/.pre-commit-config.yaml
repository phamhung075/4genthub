# Pre-commit hooks configuration for CI/CD and local development
# This runs automatically in GitHub Actions (see .github/workflows/run-static.yml)
# To use locally: pip install pre-commit && pre-commit install
#
# NOTE: Hooks run on STAGED files only and automatically re-stage formatted files

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4  # Use latest stable version
    hooks:
      # Run the linter - auto-fixes issues and re-stages files
      - id: ruff
        args: [--fix]
        stages: [pre-commit]
      # Run the formatter - formats code and re-stages files
      - id: ruff-format
        stages: [pre-commit]

  # Additional checks - run on staged files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
