# Pre-commit hooks configuration for CI/CD and local development
# This runs automatically in GitHub Actions (see .github/workflows/run-static.yml)
# To use locally: pip install pre-commit && pre-commit install
#
# NOTE: This configuration runs formatters on ALL Python files in the project
# before each commit, ensuring project-wide code consistency.

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4  # Use latest stable version
    hooks:
      # Run the linter on all files
      - id: ruff
        args: [--fix]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # Run the formatter on all files
      - id: ruff-format
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Additional checks (run on staged files only for performance)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
