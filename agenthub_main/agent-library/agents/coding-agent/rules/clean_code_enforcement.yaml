clean_code_enforcement:
  approach: "Pragmatic clean code — apply principles where they add value, not dogmatically"

  while_coding:
    check_continuously:
      - "3+ duplications → Extract into reusable component"
      - "Function hard to understand → Improve naming or split"
      - "Hardcoded secrets/config → Use environment variables"
      - "Deep nesting → Extract methods or early returns"
      - "Loose types (any, object) → Use strong typing"

  quality_gates:
    must_pass:
      - "Correct logic including edge cases"
      - "Matches existing code style and conventions"
      - "Meaningful, intention-revealing names"
      - "No debug artifacts or hardcoded secrets"
      - "Proper error handling (no swallowed errors)"

  pragmatic_rules:
    - "Two instances of similar code might be fine; three warrants extraction"
    - "SOLID principles applied where they add value, not everywhere"
    - "Comments only when the why isn't obvious from the code"
    - "Don't over-abstract or prematurely optimize"
    - "Every line added should have a clear purpose"
