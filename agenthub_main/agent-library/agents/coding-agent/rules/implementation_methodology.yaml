implementation_methodology:
  objective: |
    Write production-ready code with correctness as the highest priority.
    Read and understand existing code before making changes.
    Make minimal, precise changes that integrate seamlessly with the codebase.

  importance: |
    Correctness prevents cascading failures and regressions.
    Reading before writing ensures changes match existing patterns and conventions.
    Minimal changes reduce risk and make code review easier.

  implementation_process:
    phases:
      - understand:
          description: Read and understand the context before writing
          actions:
            - read_requirements: Understand the full requirement, ask if ambiguous
            - survey_codebase: Find relevant patterns, utilities, types, conventions
            - identify_files: List files to create or modify
            - plan_approach: Consider architecture, data flow, integration points

      - implement:
          description: Write code incrementally with correctness at each step
          actions:
            - match_conventions: Follow existing code style, naming, import patterns
            - handle_edge_cases: Think through boundary conditions and error states
            - validate_inputs: Add input validation at system boundaries
            - write_incrementally: Each piece should be correct and testable

      - verify:
          description: Confirm implementation is correct and complete
          actions:
            - check_edge_cases: Verify handling of boundary conditions
            - run_tests: Ensure existing tests still pass
            - check_integration: Verify components work together
            - review_changes: Confirm minimal footprint, no unrelated changes

  quality_standards:
    code_quality:
      - correctness: Logic handles all cases including edge cases
      - follows_conventions: Matches existing code style exactly
      - properly_typed: Strong typing, no loose types (any, object)
      - minimal_changes: Smallest change that solves the problem
      - self_documenting: Descriptive names, comments only for non-obvious why
      - dry_pragmatic: Extract at 3+ instances, not prematurely
      - solid_where_valuable: Apply SOLID principles pragmatically
      - testable: Pure functions, dependency injection, clear interfaces
      - performant: Appropriate data structures and algorithms

  bug_fix_methodology:
    steps:
      - reproduce: Understand the exact failure mode
      - trace_root_cause: Don't patch symptoms
      - fix_cause: Address the root cause directly
      - check_similar: Consider if same bug class exists elsewhere
      - verify_no_regression: Ensure fix doesn't break other things

  refactoring_methodology:
    steps:
      - understand_current: Read and understand all current behavior
      - small_steps: Make changes in small, verifiable increments
      - preserve_behavior: Keep all existing behavior unless explicitly changing
      - verify_tests: Ensure tests pass or update them if behavior intentionally changed

  best_practices:
    - read_first: Always read existing code before modifying
    - correctness_over_speed: Think through edge cases before writing
    - minimal_footprint: Every line should have a clear purpose
    - no_scope_creep: Avoid unrelated improvements unless requested
    - production_ready: No debug artifacts, hardcoded secrets, or swallowed errors
    - meaningful_names: Self-documenting, intention-revealing names
    - proper_error_handling: Meaningful messages, no silent failures
