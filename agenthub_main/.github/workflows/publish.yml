name: Publish FastMCP to PyPI

env:
  # Database configuration (required even for build due to import-time initialization)
  DATABASE_TYPE: postgresql
  DATABASE_HOST: localhost
  DATABASE_PORT: 5432
  DATABASE_NAME: agenthub_test
  DATABASE_USER: postgres
  DATABASE_PASSWORD: postgres

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # For PyPI's trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install uv"
        uses: astral-sh/setup-uv@v6

      - name: Build
        run: uv build

      - name: Publish to PyPi
        run: uv publish -v dist/*
