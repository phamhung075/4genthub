name: Run static analysis

env:
  # enable colored output
  # https://github.com/pytest-dev/pytest/issues/7443
  PY_COLORS: 1
  # Database configuration for static analysis
  DATABASE_TYPE: postgresql
  DATABASE_HOST: localhost
  DATABASE_PORT: 5432
  DATABASE_NAME: agenthub_test
  DATABASE_USER: postgres
  DATABASE_PASSWORD: postgres

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/**"

  # run on all pull requests because these checks are required and will block merges otherwise
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  static_analysis:
    timeout-minutes: 2

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          # Dev dependency group is synced by default (no flag needed)
          uv sync
      - name: Run pre-commit
        run: |
          export DATABASE_TYPE=postgresql
          export DATABASE_HOST=localhost
          export DATABASE_PORT=5432
          export DATABASE_NAME=agenthub_test
          export DATABASE_USER=postgres
          export DATABASE_PASSWORD=postgres
          uv run pre-commit run --all-files
