name: Run tests

env:
  # enable colored output
  PY_COLORS: 1
  # Database configuration for tests
  DATABASE_TYPE: postgresql
  DATABASE_HOST: localhost
  DATABASE_PORT: 5432
  DATABASE_NAME: agenthub_test
  DATABASE_USER: postgres
  DATABASE_PASSWORD: postgres

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/**"

  # run on all pull requests because these checks are required and will block merges otherwise
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_tests:
    name: "Run tests: Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10"]
      fail-fast: false
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: agenthub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install FastMCP
        run: uv sync --locked

      - name: Run tests
        run: |
          export DATABASE_TYPE=postgresql
          export DATABASE_HOST=localhost
          export DATABASE_PORT=5432
          export DATABASE_NAME=agenthub_test
          export DATABASE_USER=postgres
          export DATABASE_PASSWORD=postgres
          uv run pytest tests
